server {
 listen 80;
 server_tokens off;
 add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data: https://media.tenor.com; font-src 'self'; connect-src 'self' wss:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
 root /usr/share/nginx/html;
 location / { try_files $uri $uri/ /index.html; }
 location /assets/ { add_header Cache-Control "public,max-age=31536000,immutable"; }
}
