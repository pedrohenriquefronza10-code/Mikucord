services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tetocord}
      POSTGRES_DB: ${POSTGRES_DB:-tetocord}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Execute npm run setup}
    ports: ['127.0.0.1:5432:5432']
    volumes: ['postgres-data:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      retries: 20
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'yes']
    ports: ['127.0.0.1:6379:6379']
    volumes: ['redis-data:/data']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      retries: 10
    restart: unless-stopped
  minio:
    build:
      context: .
      dockerfile: infra/minio/Dockerfile
      secrets: [proxy_ca]
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?Execute npm run setup}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?Execute npm run setup}
    ports: ['127.0.0.1:9000:9000', '127.0.0.1:9001:9001']
    volumes: ['minio-data:/data']
    restart: unless-stopped
  backend:
    profiles: ['production']
    build:
      context: .
      dockerfile: backend/Dockerfile
      secrets: [proxy_ca]
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-tetocord}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-tetocord}
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      LIVEKIT_INTERNAL_URL: http://livekit:7880
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio: { condition: service_started }
    restart: unless-stopped
  frontend:
    profiles: ['production']
    build:
      context: .
      dockerfile: frontend/Dockerfile
      secrets: [proxy_ca]
    restart: unless-stopped
  caddy:
    profiles: ['production']
    image: caddy:2-alpine
    ports: ['80:80', '443:443', '443:443/udp']
    environment:
      APP_DOMAIN: ${APP_DOMAIN:-localhost}
      ACME_EMAIL: ${ACME_EMAIL:-}
    volumes:
      [
        './infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro',
        'caddy-data:/data',
        'caddy-config:/config',
      ]
    depends_on: [backend, frontend]
    restart: unless-stopped
volumes:
  postgres-data:
  redis-data:
  minio-data:
  caddy-data:
  caddy-config:
secrets:
  proxy_ca:
    file: ${BUILD_CA_FILE:-./infra/certs/empty.pem}
